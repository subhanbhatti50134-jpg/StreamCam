name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Syntax checks (desktop Python + mobile JS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile-check desktop Python (no imports executed)
        run: |
          python -m py_compile desktop/streamcam_core.py
          python -m py_compile desktop/tray_app.py

      - name: Syntax-check mobile JavaScript
        run: node --check mobile/www/app.js
